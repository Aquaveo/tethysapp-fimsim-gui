# CI gates for every push/PR: frontend unit tests + lint + typecheck + build,
# and backend flake8. The backend pytest suite needs the geospatial stack and
# the private fimcore package, so it runs locally / on the portal:
#   python -m pytest tethysapp/fimsim_gui/tests
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reactapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: reactapp/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install flake8
      - run: flake8 tethysapp/fimsim_gui
